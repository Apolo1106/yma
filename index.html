<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Nuestra Galaxia - Sistema Solar del Amor</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Dancing+Script:wght@500;700&family=Montserrat:wght@200;300;400;500&display=swap" rel="stylesheet">
    
    <!-- Three.js Core -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    
    <!-- Post-Processing -->
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/EffectComposer.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/RenderPass.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/ShaderPass.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/CopyShader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/LuminosityHighPassShader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/UnrealBloomPass.js"></script>

    <!-- GSAP para animaciones fluidas -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>

    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #010003;
            color: #ffffff;
            touch-action: none;
            font-family: 'Montserrat', sans-serif;
        }

        #webgl-container {
            position: absolute;
            top: 0; left: 0; width: 100vw; height: 100vh;
            z-index: 1;
        }

        /* Pantalla de Carga/Intro */
        #intro-screen {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: #010003;
            z-index: 100;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            transition: opacity 2s ease-in-out;
        }

        .loader-ring {
            width: 80px; height: 80px;
            border: 2px solid rgba(255,105,180,0.1);
            border-top-color: #ff69b4;
            border-radius: 50%;
            animation: spin 1.5s linear infinite;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        /* Tipografías */
        .font-cinzel { font-family: 'Cinzel', serif; }
        .font-dancing { font-family: 'Dancing Script', cursive; }

        /* Interfaz principal */
        #ui-layer {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            z-index: 10; pointer-events: none;
            display: flex; flex-direction: column; justify-content: space-between;
            padding: 3rem 2rem;
            opacity: 0; /* Controlado por GSAP */
            background: radial-gradient(circle at center, transparent 0%, rgba(1, 0, 3, 0.6) 100%);
        }

        .title-glow { text-shadow: 0 0 25px rgba(255, 105, 180, 0.6), 0 0 50px rgba(255, 215, 0, 0.3); }

        .stats-badge {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 105, 180, 0.3);
            backdrop-filter: blur(10px);
            box-shadow: 0 0 20px rgba(255, 105, 180, 0.1);
            border-radius: 30px;
        }

        /* Modal de Memoria Premium */
        #memory-modal {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(1, 0, 3, 0.85);
            backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            z-index: 50; display: flex; justify-content: center; align-items: center;
            opacity: 0; pointer-events: none;
            transition: opacity 0.5s cubic-bezier(0.4, 0, 0.2, 1);
        }

        #memory-modal.active { opacity: 1; pointer-events: auto; }

        .modal-card {
            background: linear-gradient(145deg, rgba(20, 5, 30, 0.9), rgba(10, 2, 15, 0.95));
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-top: 1px solid rgba(255, 182, 193, 0.4);
            padding: 2.5rem; border-radius: 20px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.8), 0 0 30px rgba(255, 105, 180, 0.15);
            width: 90%; max-width: 400px;
            transform: translateY(40px) scale(0.95);
            transition: all 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
            position: relative; text-align: center;
        }

        #memory-modal.active .modal-card { transform: translateY(0) scale(1); }

        .modal-image {
            width: 100%; aspect-ratio: 1/1; object-fit: cover;
            border-radius: 12px; margin-bottom: 1.5rem;
            box-shadow: 0 10px 20px rgba(0,0,0,0.5);
            border: 2px solid rgba(255,255,255,0.05);
        }

        .close-btn {
            position: absolute; top: -15px; right: -15px;
            background: #1a0b2e; border: 1px solid rgba(255, 105, 180, 0.5);
            color: #fff; width: 36px; height: 36px; border-radius: 50%;
            cursor: pointer; display: flex; justify-content: center; align-items: center;
            transition: all 0.3s; box-shadow: 0 0 15px rgba(255,105,180,0.3);
        }
        .close-btn:hover { background: #ff69b4; transform: rotate(90deg) scale(1.1); }
    </style>
</head>
<body>

    <!-- Pantalla de Inicio -->
    <div id="intro-screen">
        <div class="loader-ring mb-6"></div>
        <h2 class="font-cinzel text-pink-300 text-xl tracking-[0.3em] uppercase">Creando Galaxia</h2>
        <p class="text-gray-400 text-sm mt-2 font-light animate-pulse">Calculando estrellas...</p>
    </div>

    <!-- Contenedor 3D -->
    <div id="webgl-container"></div>

    <!-- UI Capa Superior -->
    <div id="ui-layer">
        <div class="text-center w-full mt-4 md:mt-8">
            <h2 class="font-cinzel text-pink-400 text-xs md:text-sm tracking-[0.4em] uppercase mb-2">Nuestro Universo</h2>
            <h1 id="main-title" class="font-dancing text-white text-6xl md:text-8xl title-glow mb-4">6 Meses</h1>
            
            <div class="inline-flex flex-col items-center justify-center stats-badge px-6 py-3 mt-2">
                <span id="days-counter" class="text-2xl md:text-3xl font-light text-white mb-1">...</span>
                <span class="text-xs text-pink-200 tracking-wider uppercase font-cinzel">Estrellas en tu honor</span>
            </div>
        </div>
        
        <div class="flex justify-center w-full mb-8">
            <div class="stats-badge px-6 py-3 flex items-center gap-3">
                <svg class="w-5 h-5 text-pink-400 animate-pulse" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 15l-2 5L9 9l11 4-5 2zm0 0l5 5M7.188 2.239l.777 2.897M5.136 7.965l-2.898-.777M13.95 4.05l-2.122 2.122m-5.657 5.656l-2.12 2.122"></path></svg>
                <span class="text-xs tracking-wider uppercase text-white/90">Arrastra para girar • Toca los cristales</span>
            </div>
        </div>
    </div>

    <!-- Modal de Memoria -->
    <div id="memory-modal">
        <div class="modal-card">
            <button class="close-btn" id="close-modal">✕</button>
            <img src="" alt="Recuerdo" class="modal-image" id="modal-img">
            <h3 class="font-cinzel font-bold text-2xl text-pink-300 mb-2" id="modal-title"></h3>
            <div class="w-16 h-[1px] bg-gradient-to-r from-transparent via-pink-500 to-transparent mx-auto mb-4"></div>
            <p class="font-light text-gray-300 text-sm leading-relaxed" id="modal-desc"></p>
        </div>
    </div>

    <script>
        // ==========================================
        // CÁLCULO DE DÍAS, MESES Y ESTRELLAS
        // ==========================================
        const startDate = new Date('2026-03-28T00:00:00');
        const today = new Date();
        const diffTime = Math.abs(today - startDate);
        const daysTogether = Math.ceil(diffTime / (1000 * 60 * 60 * 24));
        
        // Cálculo de meses para el título dinámico
        let monthsTogether = (today.getFullYear() - startDate.getFullYear()) * 12;
        monthsTogether -= startDate.getMonth();
        monthsTogether += today.getMonth();
        if (today.getDate() < startDate.getDate()) {
            monthsTogether--;
        }
        monthsTogether = Math.max(1, monthsTogether); // Asegurar al menos 1 mes

        // Actualizar UI
        document.getElementById('days-counter').textContent = `${daysTogether} Días`;
        document.getElementById('main-title').textContent = `${monthsTogether} Meses`;

        // ==========================================
        // DATOS DE LOS CRISTALES (Tus fotos)
        // Para agregar más planetas, simplemente añade un nuevo bloque con url, title y description.
        // La distancia, tamaño y velocidad se calcularán automáticamente para que sea súper fácil.
        // ==========================================
        const memories = [
            {
                url: 'https://placehold.co/800x800/31102A/FFB6C1?text=Mes+1', 
                title: 'El Comienzo',
                description: 'La chispa que encendió esta galaxia. Aquel 28 de marzo de 2026 mi vida cambió para siempre.'
            },
            {
                url: 'https://placehold.co/800x800/4A154B/FFD700?text=Mes+2',
                title: 'Nuestras Risas',
                description: 'Tus chistes y tu sonrisa iluminan hasta mis días más oscuros. Eres mi sol.'
            },
            {
                url: 'https://placehold.co/800x800/1A1A3A/00FFFF?text=Mes+3',
                title: 'Aventuras',
                description: 'Cada momento a tu lado es una nueva constelación que descubrimos juntos.'
            },
            {
                url: 'https://placehold.co/800x800/2C001E/FF69B4?text=Mes+4',
                title: 'Tu Apoyo',
                description: 'Gracias por ser mi gravedad, manteniéndome firme cuando siento que floto a la deriva.'
            },
            {
                url: 'https://placehold.co/800x800/00203F/ADEFD1?text=Mes+5',
                title: 'Crecimiento',
                description: 'Crecer a tu lado es el viaje más hermoso. Te admiro cada día más.'
            },
            {
                url: 'https://placehold.co/800x800/400036/EAE2D6?text=Mes+6',
                title: 'Hoy y Siempre',
                description: 'Felices meses, mi amor. Y que esta galaxia siga sumando estrellas por el resto de nuestras vidas.'
            }
        ];

        // ==========================================
        // VARIABLES GLOBALES THREE.JS
        // ==========================================
        let scene, camera, renderer, composer;
        let galaxyGroup, coreLight;
        let planetObjects = [];
        let raycaster, mouse;
        let dayStarsUniforms;
        let stardustUniforms; // Nuevo: Uniforms para el polvo estelar
        
        let isDragging = false;
        let previousMousePosition = { x: 0, y: 0 };
        // Empezamos la cámara justo arriba para la animación de entrada
        let cameraParams = { radius: 10, angleX: 0, angleY: 0.1, yOffset: 200 };
        let isModalOpen = false;
        
        const container = document.getElementById('webgl-container');
        const modal = document.getElementById('memory-modal');
        const textureLoader = new THREE.TextureLoader();

        init();

        function init() {
            // 1. Escena
            scene = new THREE.Scene();
            scene.fog = new THREE.FogExp2(0x010003, 0.004);

            // 2. Cámara
            camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 1, 2000);
            updateCameraPosition();

            // 3. Renderizador
            renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.toneMapping = THREE.ACESFilmicToneMapping;
            renderer.toneMappingExposure = 0.8; // Reducido de 1.2 a 0.8 para evitar saturación
            container.appendChild(renderer.domElement);

            // 4. Luces
            scene.add(new THREE.AmbientLight(0x221144, 0.5)); // Intensidad reducida de 1.5 a 0.5
            coreLight = new THREE.PointLight(0xffaaee, 1.5, 300); // Intensidad reducida de 3 a 1.5
            scene.add(coreLight);

            galaxyGroup = new THREE.Group();
            scene.add(galaxyGroup);

            // 5. Creación de la Galaxia
            createGalacticCore();
            createStardust(); // Polvo estelar (Fondo de la galaxia)
            createDayStars(); // Una estrella brillante por cada día
            createCrystalMemories(); // Planetas/Fotos

            // 6. Post-Procesamiento (Bloom Premium)
            setupPostProcessing();

            // 7. Eventos
            raycaster = new THREE.Raycaster();
            mouse = new THREE.Vector2();

            window.addEventListener('resize', onWindowResize);
            container.addEventListener('mousedown', onPointerDown);
            container.addEventListener('touchstart', onPointerDown, {passive: false});
            window.addEventListener('mousemove', onPointerMove);
            window.addEventListener('touchmove', onPointerMove, {passive: false});
            window.addEventListener('mouseup', onPointerUp);
            window.addEventListener('touchend', onPointerUp);
            container.addEventListener('click', onCanvasClick);
            document.getElementById('close-modal').addEventListener('click', closeModal);

            // 8. Iniciar loop y animaciones
            requestAnimationFrame(animate);
            startIntroAnimation();
        }

        // Helper: Crear textura de partícula circular suave (Sin usar imágenes externas)
        function getParticleTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 64; canvas.height = 64;
            const ctx = canvas.getContext('2d');
            // Hacemos el centro más sólido para que el Bloom lo tome mejor
            const gradient = ctx.createRadialGradient(32, 32, 0, 32, 32, 32);
            gradient.addColorStop(0, 'rgba(255,255,255,1)');
            gradient.addColorStop(0.3, 'rgba(255,255,255,0.9)');
            gradient.addColorStop(0.6, 'rgba(255,255,255,0.4)');
            gradient.addColorStop(1, 'rgba(0,0,0,0)');
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, 64, 64);
            return new THREE.CanvasTexture(canvas);
        }

        function createGalacticCore() {
            // El centro brillante de la galaxia
            const coreGeo = new THREE.SphereGeometry(8, 32, 32);
            const coreMat = new THREE.MeshBasicMaterial({ color: 0xffe6f2, transparent: true, opacity: 0.9 });
            const core = new THREE.Mesh(coreGeo, coreMat);
            galaxyGroup.add(core);

            // Aura del núcleo
            const auraGeo = new THREE.SphereGeometry(12, 32, 32);
            const auraMat = new THREE.MeshBasicMaterial({ color: 0xff69b4, transparent: true, opacity: 0.2, side: THREE.BackSide, blending: THREE.AdditiveBlending });
            const aura = new THREE.Mesh(auraGeo, auraMat);
            galaxyGroup.add(aura);
        }

        function createStardust() {
            // Miles de partículas formando los brazos espirales de la galaxia
            const stardustCount = 6000; // Reducido de 15000 para que no abrume
            const geometry = new THREE.BufferGeometry();
            const positions = new Float32Array(stardustCount * 3);
            const colors = new Float32Array(stardustCount * 3);
            const targetPositions = new Float32Array(stardustCount * 3); // Para la explosión
            
            // Nuevos colores vibrantes
            const color1 = new THREE.Color(0x00ffff); // Cyan/Azul brillante
            const color2 = new THREE.Color(0x8a2be2); // Violeta/Púrpura
            const color3 = new THREE.Color(0xffd700); // Amarillo cálido/Dorado
            const color4 = new THREE.Color(0xff69b4); // Rosa vibrante (de base)

            for(let i = 0; i < stardustCount; i++) {
                const i3 = i * 3;
                
                // Distribución en espiral matemática
                const radius = 5 + Math.random() * 160;
                const spinAngle = radius * 0.035; // Qué tan apretada es la espiral
                const branchAngle = ((i % 4) * Math.PI * 2 / 4); // 4 brazos para más densidad
                
                // Añadir ruido/dispersión
                const randomX = Math.pow(Math.random(), 2) * (Math.random() < 0.5 ? 1 : -1) * 25;
                const randomY = Math.pow(Math.random(), 2) * (Math.random() < 0.5 ? 1 : -1) * 10;
                const randomZ = Math.pow(Math.random(), 2) * (Math.random() < 0.5 ? 1 : -1) * 25;

                // Posición final (target)
                const tx = Math.cos(branchAngle + spinAngle) * radius + randomX;
                const ty = randomY * (25 / (radius * 0.2 + 1));
                const tz = Math.sin(branchAngle + spinAngle) * radius + randomZ;

                targetPositions[i3] = tx;
                targetPositions[i3+1] = ty;
                targetPositions[i3+2] = tz;

                // Empiezan en el centro (x, y, z = 0) para el Big Bang
                positions[i3] = 0;
                positions[i3+1] = 0;
                positions[i3+2] = 0;

                // Selección de color aleatoria y mezcla
                const mixRatio = Math.random();
                let finalColor = new THREE.Color();
                
                if(mixRatio < 0.25) finalColor.copy(color1); // 25% Azules
                else if(mixRatio < 0.5) finalColor.copy(color2); // 25% Violetas
                else if(mixRatio < 0.75) finalColor.copy(color3); // 25% Amarillos
                else finalColor.copy(color4); // 25% Rosas

                // Mezclar ligeramente con blanco para darle brillo de núcleo estelar
                finalColor.lerp(new THREE.Color(0xffffff), Math.random() * 0.3);

                colors[i3] = finalColor.r; colors[i3+1] = finalColor.g; colors[i3+2] = finalColor.b;
            }

            geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            geometry.setAttribute('targetPosition', new THREE.BufferAttribute(targetPositions, 3));
            geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));

            stardustUniforms = {
                expansionProgress: { value: 0.0 }, // 0 = centro, 1 = expandido
                textureMap: { value: getParticleTexture() }
            };

            const material = new THREE.ShaderMaterial({
                uniforms: stardustUniforms,
                vertexShader: `
                    uniform float expansionProgress;
                    attribute vec3 targetPosition;
                    // El atributo 'color' lo inyecta Three.js automáticamente al usar vertexColors: true
                    varying vec3 vColor;
                    void main() {
                        vColor = color;
                        // Interpolar desde el centro (0,0,0) hacia la posición final
                        vec3 currentPos = mix(vec3(0.0), targetPosition, expansionProgress);
                        vec4 mvPosition = modelViewMatrix * vec4(currentPos, 1.0);
                        
                        // Tamaño dinámico: más grande cerca, más pequeño lejos
                        // Reducimos el tamaño base (de 45.0 a 20.0) para que sea un polvo más fino
                        gl_PointSize = (20.0) * (100.0 / -mvPosition.z); 
                        gl_Position = projectionMatrix * mvPosition;
                    }
                `,
                fragmentShader: `
                    uniform sampler2D textureMap;
                    varying vec3 vColor;
                    void main() {
                        // Multiplicamos el color por la textura para mantener la opacidad correcta
                        vec4 texColor = texture2D(textureMap, gl_PointCoord);
                        // Brillo sutil ajustado a 0.17
                        gl_FragColor = vec4(vColor, texColor.a * 0.17) * texColor;
                    }
                `,
                transparent: true,
                blending: THREE.AdditiveBlending, // Clave para que los colores brillen al superponerse
                depthWrite: false, // Fundamental para evitar artefactos en partículas superpuestas
                vertexColors: true
            });

            const stardust = new THREE.Points(geometry, material);
            galaxyGroup.add(stardust);
        }

        function createDayStars() {
            // ESTRELLAS EXACTAS POR DÍAS (1 estrella = 1 día juntos)
            const geometry = new THREE.BufferGeometry();
            const positions = new Float32Array(daysTogether * 3);
            const targetPositions = new Float32Array(daysTogether * 3);
            const phases = new Float32Array(daysTogether); // Para parpadeo asíncrono

            for(let i = 0; i < daysTogether; i++) {
                const i3 = i * 3;
                // Distribuirlas al azar en una esfera amplia para que rodeen todo
                const r = 30 + Math.random() * 120;
                const theta = Math.random() * Math.PI * 2;
                const phi = Math.acos((Math.random() * 2) - 1);

                const tx = r * Math.sin(phi) * Math.cos(theta);
                const ty = r * Math.sin(phi) * Math.sin(theta);
                const tz = r * Math.cos(phi);

                targetPositions[i3] = tx;
                targetPositions[i3+1] = ty;
                targetPositions[i3+2] = tz;
                
                // Inician en el centro
                positions[i3] = 0;
                positions[i3+1] = 0;
                positions[i3+2] = 0;

                phases[i] = Math.random() * Math.PI * 2;
            }

            geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            geometry.setAttribute('targetPosition', new THREE.BufferAttribute(targetPositions, 3));
            geometry.setAttribute('phase', new THREE.BufferAttribute(phases, 1));

            dayStarsUniforms = {
                time: { value: 0 },
                expansionProgress: { value: 0.0 }, // Control para GSAP
                color: { value: new THREE.Color(0xffffff) },
                textureMap: { value: getParticleTexture() }
            };

            // Custom Shader para hacer que brillen/parpadeen fuertemente
            const material = new THREE.ShaderMaterial({
                uniforms: dayStarsUniforms,
                vertexShader: `
                    uniform float time;
                    uniform float expansionProgress;
                    attribute vec3 targetPosition;
                    attribute float phase;
                    varying float vAlpha;
                    void main() {
                        // Animación de parpadeo suave, explosión inicial mucho menos intensa
                        float explosionFlash = (1.0 - expansionProgress) * 0.5; 
                        
                        // Aumentamos el brillo base de estas estrellas (de 0.3 a 0.7) para que destaquen más
                        vAlpha = 0.7 + 0.3 * sin(time * 2.0 + phase) + explosionFlash;
                        
                        vec3 currentPos = mix(vec3(0.0), targetPosition, expansionProgress);
                        vec4 mvPosition = modelViewMatrix * vec4(currentPos, 1.0);
                        
                        // Tamaño dinámico de la estrella (Aumentado de 25.0 a 45.0) para que se vean claramente
                        gl_PointSize = (45.0 * vAlpha) * (100.0 / -mvPosition.z);
                        gl_Position = projectionMatrix * mvPosition;
                    }
                `,
                fragmentShader: `
                    uniform vec3 color;
                    uniform sampler2D textureMap;
                    varying float vAlpha;
                    void main() {
                        gl_FragColor = vec4(color, vAlpha) * texture2D(textureMap, gl_PointCoord);
                    }
                `,
                transparent: true,
                blending: THREE.AdditiveBlending,
                depthWrite: false
            });

            const dayStars = new THREE.Points(geometry, material);
            scene.add(dayStars);
        }

        function createCrystalMemories() {
            // Material de cristal ultra-premium modificado para mayor visibilidad y brillo sutil
            const glassMaterial = new THREE.MeshPhysicalMaterial({
                color: 0xffffff,
                emissive: 0x442266, // Brillo violeta/rosa sutil para que resplandezca
                metalness: 0.1,     // Menos metálico, más transparente
                roughness: 0.0,     // Cristal perfectamente liso
                transmission: 1.0,  // Transmisión total de la luz de la foto
                ior: 1.15,          // Menor índice de refracción para que la foto se vea clara y no se deforme
                thickness: 0.2,
                transparent: true,
                opacity: 1
            });

            memories.forEach((data, index) => {
                const group = new THREE.Group();

                // Autocalcular propiedades orbitales para facilitar la adición de nuevos planetas
                data.distance = 25 + (index * 13); // Cada nuevo planeta se aleja automáticamente
                data.size = 3.5 + (index * 0.1); // Los planetas base ahora son más grandes
                
                // Velocidad aleatoria (positiva o negativa para orbitar en distintas direcciones)
                const baseSpeed = 0.001 + (Math.random() * 0.002);
                data.speed = Math.random() > 0.5 ? baseSpeed : -baseSpeed; 
                
                // Ángulo inicial aleatorio para evitar la forma de hélice
                data.angle = Math.random() * Math.PI * 2; 

                // 1. Burbuja de Cristal (Ahora más grande)
                const sphereGeo = new THREE.SphereGeometry(data.size, 64, 64);
                const bubble = new THREE.Mesh(sphereGeo, glassMaterial);
                group.add(bubble);

                // 2. Foto interna (Sprite para que siempre mire a la cámara)
                const tex = textureLoader.load(data.url);
                const spriteMat = new THREE.SpriteMaterial({ map: tex, color: 0xffffff });
                const sprite = new THREE.Sprite(spriteMat);
                
                // Escalar el sprite para que ocupe casi toda la burbuja (1.8 en lugar de 1.5)
                sprite.scale.set(data.size * 1.8, data.size * 1.8, 1);
                group.add(sprite);

                // 3. Anillo de órbita decorativo (opcional, le da un toque cósmico)
                const orbitGeo = new THREE.RingGeometry(data.distance - 0.2, data.distance + 0.2, 128);
                const orbitMat = new THREE.MeshBasicMaterial({ color: 0xffffff, side: THREE.DoubleSide, transparent: true, opacity: 0.15 }); // Más visible (0.15)
                const orbit = new THREE.Mesh(orbitGeo, orbitMat);
                orbit.rotation.x = Math.PI / 2;
                scene.add(orbit);

                // Guardar datos para interacción (hacer click en el cristal)
                bubble.userData = { isPlanet: true, info: data };

                // Empezar en el centro (escala 0)
                group.scale.set(0, 0, 0);

                // Añadir al control
                scene.add(group);
                planetObjects.push({
                    group: group,
                    mesh: bubble, // Para el raycaster
                    orbitMesh: orbit, // Para animar el anillo
                    data: data,
                    currentAngle: data.angle
                });
            });
        }

        function setupPostProcessing() {
            const renderScene = new THREE.RenderPass(scene, camera);
            // Efecto de resplandor (Bloom) ajustado para no saturar
            const bloomPass = new THREE.UnrealBloomPass(new THREE.Vector2(window.innerWidth, window.innerHeight), 1.5, 0.4, 0.85);
            bloomPass.threshold = 0.2;
            bloomPass.strength = 0.6; // Mucho menos intenso (antes era 1.8)
            bloomPass.radius = 0.4;

            composer = new THREE.EffectComposer(renderer);
            composer.addPass(renderScene);
            composer.addPass(bloomPass);
        }

        function startIntroAnimation() {
            // Animación Cinemática con GSAP
            setTimeout(() => {
                // Ocultar pantalla de carga
                document.getElementById('intro-screen').style.opacity = '0';
                setTimeout(() => document.getElementById('intro-screen').style.display = 'none', 2000);

                // 1. Animar Cámara
                gsap.to(cameraParams, {
                    radius: 120, // Distancia final
                    angleX: Math.PI / 4, // Ángulo horizontal
                    angleY: Math.PI / 3, // Ángulo picado
                    yOffset: 0,
                    duration: 4.5,
                    ease: "power2.out",
                    onUpdate: updateCameraPosition
                });

                // 2. BIG BANG: Animar Polvo Estelar y Estrellas (Uniforms)
                gsap.to([stardustUniforms.expansionProgress, dayStarsUniforms.expansionProgress], {
                    value: 1.0,
                    duration: 3.5,
                    ease: "power4.out" // Aceleración inicial fuerte
                });

                // 3. BIG BANG: Animar Planetas (Escala)
                planetObjects.forEach((p, i) => {
                    // Los planetas crecen mientras se alejan
                    gsap.to(p.group.scale, {
                        x: 1, y: 1, z: 1,
                        duration: 3,
                        delay: 0.2 + (i * 0.1), // Aparecen ligeramente desfasados
                        ease: "elastic.out(1, 0.7)" // Efecto rebote suave
                    });
                });

                // Aparecer Interfaz
                gsap.to('#ui-layer', {
                    opacity: 1,
                    duration: 2,
                    delay: 2.5
                });
            }, 1000);
        }

        function updateCameraPosition() {
            camera.position.x = cameraParams.radius * Math.sin(cameraParams.angleY) * Math.cos(cameraParams.angleX);
            camera.position.y = cameraParams.radius * Math.cos(cameraParams.angleY) + cameraParams.yOffset;
            camera.position.z = cameraParams.radius * Math.sin(cameraParams.angleY) * Math.sin(cameraParams.angleX);
            camera.lookAt(scene.position);
        }

        function onPointerDown(event) {
            if (isModalOpen) return;
            isDragging = true;
            const clientX = event.touches ? event.touches[0].clientX : event.clientX;
            const clientY = event.touches ? event.touches[0].clientY : event.clientY;
            previousMousePosition = { x: clientX, y: clientY };
            document.body.style.cursor = 'grabbing';
        }

        function onPointerMove(event) {
            const clientX = event.touches ? event.touches[0].clientX : event.clientX;
            const clientY = event.touches ? event.touches[0].clientY : event.clientY;
            
            // Efecto Hover
            if (!isDragging && !isModalOpen && !event.touches) {
                mouse.x = (clientX / window.innerWidth) * 2 - 1;
                mouse.y = -(clientY / window.innerHeight) * 2 + 1;
                raycaster.setFromCamera(mouse, camera);
                const intersects = raycaster.intersectObjects(planetObjects.map(p => p.mesh));
                document.body.style.cursor = intersects.length > 0 ? 'pointer' : 'default';
            }

            if (!isDragging || isModalOpen) return;

            const deltaMove = {
                x: clientX - previousMousePosition.x,
                y: clientY - previousMousePosition.y
            };

            cameraParams.angleX -= deltaMove.x * 0.005;
            cameraParams.angleY -= deltaMove.y * 0.005;
            // Limitar ángulo vertical
            cameraParams.angleY = Math.max(0.1, Math.min(Math.PI - 0.1, cameraParams.angleY));

            updateCameraPosition();
            previousMousePosition = { x: clientX, y: clientY };
        }

        function onPointerUp() {
            isDragging = false;
            document.body.style.cursor = 'default';
        }

        function onCanvasClick(event) {
            if (isModalOpen || isDragging) return; 
            
            const clientX = event.clientX;
            const clientY = event.clientY;

            mouse.x = (clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(clientY / window.innerHeight) * 2 + 1;

            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObjects(planetObjects.map(p => p.mesh));

            if (intersects.length > 0) {
                openModal(intersects[0].object.userData.info);
            }
        }

        function openModal(info) {
            isModalOpen = true;
            document.getElementById('modal-img').src = info.url;
            document.getElementById('modal-title').textContent = info.title;
            document.getElementById('modal-desc').textContent = info.description;
            
            modal.classList.add('active');
            
            // Acercar cámara temporalmente con GSAP
            gsap.to(cameraParams, {
                radius: 70, duration: 1, ease: "power2.out", onUpdate: updateCameraPosition
            });
        }

        function closeModal() {
            modal.classList.remove('active');
            
            // Alejar cámara
            gsap.to(cameraParams, {
                radius: 120, duration: 1, ease: "power2.out", onUpdate: updateCameraPosition
            });
            
            setTimeout(() => { isModalOpen = false; }, 500);
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            composer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);
            
            const time = Date.now() * 0.001;

            // Actualizar tiempo para shaders de las estrellas de días
            if(dayStarsUniforms) {
                dayStarsUniforms.time.value = time;
            }

            // Rotación suave de la galaxia completa
            galaxyGroup.rotation.y = time * 0.02;

            // Pulsación de la luz central (más suave)
            coreLight.intensity = 1.5 + Math.sin(time * 3) * 0.3;

            // Animación de Planetas/Burbujas
            planetObjects.forEach(p => {
                const speedMult = isModalOpen ? 0.05 : 1; // Ralentizar si el modal está abierto
                
                p.currentAngle -= (p.data.speed * speedMult);
                
                // Mover el Grupo entero (Cristal + Foto)
                p.group.position.x = Math.cos(p.currentAngle) * p.data.distance;
                p.group.position.z = Math.sin(p.currentAngle) * p.data.distance;
                
                // Flotación sutil en Y
                p.group.position.y = Math.sin(time * 2 + p.data.distance) * 2;
            });

            // Renderizar usando el post-procesamiento (Bloom)
            composer.render();
        }
    </script>
</body>
</html>
